name: Verify admissions data and web application
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: analytics_test
          POSTGRES_PASSWORD: test-only-not-a-production-secret
          POSTGRES_DB: analytics_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U analytics_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_ANALYTICS_DATABASE_URL: postgresql://analytics_test:test-only-not-a-production-secret@127.0.0.1:5432/analytics_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python scripts/validate_admissions.py
      - run: mvn -B -ntp verify
